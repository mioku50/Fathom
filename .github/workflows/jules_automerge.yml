name: 1. Auto-Validate, Merge and Continue Jules PRs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fathom-automerge
  cancel-in-progress: false

jobs:
  test-merge-and-continue:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.user.login == 'google-labs-jules[bot]' ||
      github.event.pull_request.user.login == 'google-jules[bot]' ||
      github.event.pull_request.user.login == 'mioku50' ||
      contains(github.event.pull_request.labels.*.name, 'jules')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: |
          python -m pip install -U pip pytest

      - name: Auto-format agent task manifest
        id: format_manifest
        run: |
          python scripts/format_agent_tasks.py agent_tasks.json

          if ! git diff --quiet -- agent_tasks.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add agent_tasks.json
            git commit -m "chore: format agent task manifest"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop after formatting push
        if: steps.format_manifest.outputs.changed == 'true'
        run: |
          echo "agent_tasks.json was formatted and pushed. A new PR check run will start."

      - name: Validate agent task manifest
        if: steps.format_manifest.outputs.changed != 'true'
        run: python scripts/validate_agent_tasks.py agent_tasks.json

      - name: Check agent task formatting
        if: steps.format_manifest.outputs.changed != 'true'
        run: python scripts/format_agent_tasks.py --check agent_tasks.json

      - name: Run Python tests
        if: steps.format_manifest.outputs.changed != 'true'
        run: pytest tests/test_agent_tasks.py

      - name: Run TypeScript checks if package.json exists
        if: steps.format_manifest.outputs.changed != 'true'
        run: |
          if [ -f package.json ]; then
            npm install
            npm test --if-present
            npm run typecheck --if-present
          fi

      - name: Merge PR
        if: steps.format_manifest.outputs.changed != 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge --delete-branch

      - name: Trigger next Jules task after merge
        if: steps.format_manifest.outputs.changed != 'true' && success()
        run: |
          PROMPT=$(cat <<'PROMPT_EOF'
          You are the autonomous production development worker for Fathom.

          Repository: mioku50/Fathom

          Continue developing Fathom toward a production-ready MVP through the autonomous task loop.

          Important setup rule:
          Work from the repository root provided by Jules. Do not run `cd /app`.

          Read first:
          - README.md
          - AGENTS.md
          - agent_tasks.json
          - docs/jules_autonomous_loop.md
          - docs/architecture.md
          - docs/codex_worker_plan.md

          Start by running:
          pwd
          ls -la
          python -m fathom_agent.codex_bridge validate
          python -m fathom_agent.codex_bridge status
          python -m fathom_agent.codex_bridge next-task
          python -m fathom_agent.codex_bridge render-prompt

          Operating model:
          - Use agent_tasks.json as the source of truth.
          - Select the first safe todo task.
          - Implement exactly one task id per PR.
          - Stay inside the selected task's allowed_paths.
          - Run validation/tests before finishing.
          - Update agent_tasks.json after completing the task.
          - Run python scripts/format_agent_tasks.py agent_tasks.json before finishing.
          - If new work is discovered, add it as new todo tasks instead of expanding the current PR.
          - If fewer than replenishment_policy.minimum_todo_tasks remain, add a small batch of low/medium-risk tasks.
          - Never ask the user what to do next while safe low/medium-risk work exists.
          - If CI fails, prioritize a fix task before new feature work.

          Safety rules:
          - Do not add secrets.
          - Do not commit .env files.
          - Do not enable auto-merge.
          - Do not deploy production.
          - Do not use paid services.
          - Do not add private keys, API keys or wallet credentials.
          - Do not modify x402 payment verification, facilitator config, env handling, RPC provider config or GitHub workflow permissions unless the selected task explicitly allows it.
          - High and critical risk tasks require human review.

          Validation commands:
          python scripts/format_agent_tasks.py agent_tasks.json
          python scripts/validate_agent_tasks.py agent_tasks.json
          pytest tests/test_agent_tasks.py
          python -m fathom_agent.codex_bridge validate
          python -m fathom_agent.codex_bridge status
          python -m fathom_agent.codex_bridge next-task
          npm test --if-present
          npm run typecheck --if-present

          PR requirements:
          - Mention the selected task id.
          - Summarize what changed.
          - List exact validation commands run.
          - Update agent_tasks.json.
          - Keep the diff inside allowed_paths unless the manifest was updated with a clear reason.
          - Add tests for code changes.
          - Open one PR when done.
          PROMPT_EOF
          )

          curl -f 'https://jules.googleapis.com/v1alpha/sessions' \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Goog-Api-Key: ${{ secrets.JULES_API_KEY }}" \
            -d "$(jq -n \
              --arg prompt "$PROMPT" \
              --arg source "sources/github/${{ github.repository }}" \
              '{
                "prompt": $prompt,
                "sourceContext": {
                  "source": $source,
                  "githubRepoContext": {"startingBranch": "main"}
                },
                "automationMode": "AUTO_CREATE_PR",
                "title": "Fathom Autonomous Development Loop"
              }')"
