name: 1. Auto-Validate and Merge Jules PRs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.user.login == 'google-jules[bot]' ||
      github.event.pull_request.user.login == 'mioku50' ||
      contains(github.event.pull_request.labels.*.name, 'jules')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: |
          python -m pip install -U pip pytest

      - name: Validate agent task manifest
        run: python scripts/validate_agent_tasks.py agent_tasks.json

      - name: Run Python tests
        run: pytest tests/test_agent_tasks.py

      - name: Run TypeScript checks if package.json exists
        run: |
          if [ -f package.json ]; then
            npm install
            npm test --if-present
            npm run typecheck --if-present
          fi

      - name: Merge PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge --delete-branch
