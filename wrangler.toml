name = "fathom-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

# SKILL.md is served verbatim at /SKILL.md so an agent can load Fathom as a
# capability. Importing it as text keeps the repository file the single source:
# the published skill cannot drift from the one in git.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true
workers_dev = true
preview_urls = true

[observability]
enabled = true

# Scheduled self-check. Fathom fails quietly - a moved factory or a reverting
# quoter still returns 200 - so the checks assert real invariants, not uptime.
[triggers]
crons = ["*/15 * * * *"]

[placement]
mode = "smart"

[vars]
X402_NETWORK = "eip155:8453"
X402_PRICE_USDC = "0.001"
X402_PRICE_SINGLE_USDC = "0.001"
X402_PRICE_BATCH_USDC = "0.003"
MAX_BATCH_TOKENS = "50"
CACHE_DEFAULT_TTL_SECONDS = "60"
BASE_BUILDER_CODE = "bc_tzj2linw"
FATHOM_X402_FACILITATOR_URL = "https://api.cdp.coinbase.com/platform/v2/x402"
FATHOM_X402_RECIPIENT = "0x8e525BfCe1eF40Aa8075ef64E45421b5855C8909"

[[kv_namespaces]]
binding = "FATHOM_KV"
id = "5f4f77f8f64b471daaa7e40452ec599f"
preview_id = "f5c96d6161dd439f82fa9e6d4b7989ca"
